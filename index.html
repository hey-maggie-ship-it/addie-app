<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA: makes Ankora installable to the home screen -->
    <meta name="theme-color" content="#0B84FE" />
    <meta name="description" content="Ankora — a warm, no-nonsense thinking partner for overwhelmed high achievers, including people with ADHD." />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS standalone / add-to-home-screen support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ankora" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph (Facebook, iMessage, LinkedIn, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ankora" />
    <meta property="og:title" content="Ankora — clarity for a busy brain" />
    <meta property="og:description" content="A warm, no-nonsense thinking partner for overwhelmed high achievers, including people with ADHD. Plan your day, beat overwhelm, and get unstuck." />
    <meta property="og:url" content="https://ankorahq.com/" />
    <meta property="og:image" content="https://ankorahq.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ankora — clarity for a busy brain" />
    <meta name="twitter:description" content="A warm, no-nonsense thinking partner for overwhelmed high achievers, including people with ADHD." />
    <meta name="twitter:image" content="https://ankorahq.com/og-image.png" />

    <title>Ankora — clarity for a busy brain</title>
