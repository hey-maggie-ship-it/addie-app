<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA: makes Ankora installable to the home screen -->
    <meta name="theme-color" content="#2D2553" />
    <meta name="description" content="The AI that helps you start. Dump the overwhelm, get one clear next step, stay anchored." />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS standalone / add-to-home-screen support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ankora" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph (Facebook, iMessage, LinkedIn, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ankora" />
    <meta property="og:title" content="Ankora - start the thing you've been avoiding" />
    <meta property="og:description" content="The AI that helps you start. Dump the overwhelm, get one clear next step, stay anchored." />
    <meta property="og:url" content="https://app.ankorahq.com/" />
    <!-- Versioned filename on purpose: link scrapers cache previews by URL, so
         replacing the file in place keeps showing the old card. Bump the version
         (here and in landing/index.html) when the card changes. -->
    <meta property="og:image" content="https://app.ankorahq.com/og-image-v2.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ankora - start the thing you've been avoiding" />
    <meta name="twitter:description" content="The AI that helps you start. Dump the overwhelm, get one clear next step, stay anchored." />
    <meta name="twitter:image" content="https://app.ankorahq.com/og-image-v2.jpg" />

    <title>Ankora - let's get going</title>

    <!-- Google Analytics (GA4). Same measurement ID as the landing pages so the
         ankorahq.com -> app.ankorahq.com hop stays ONE session and the Google Ads
         gclid survives it (the _ga / _gcl_au cookies are set on .ankorahq.com).
         Product analytics stays in PostHog; GA4 is here for ads + SEO. The signup
         conversion to import into Google Ads is the `sign_up` event in App.jsx. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KVSZ6CD1EY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-KVSZ6CD1EY');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
