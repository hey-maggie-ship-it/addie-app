name: Push Notifications Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron-push
        run: |
          curl -sfL "${{ secrets.APP_URL }}/api/cron-push" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
